run_name: ""
metrics_dir: ""
tensorboard_dir: ""
output_dir: ""

model_name: "ideogram4"
pretrained_model_name_or_path: "ideogram-ai/ideogram-4-fp8"

prompt: >
  {"high_level_description": "A magical, cinematic shot of a couple holding hands on a flying carpet soaring high above a historic Arabian desert town at sunset.", "style_description": {"aesthetics": "historic, magical realism, epic fantasy, cinematic", "lighting": "golden hour, dramatic sunset lighting, long shadows, warm glowing atmosphere", "photo": "shot on 35mm lens, wide aperture, photorealistic, hyper-detailed", "medium": "digital photography, cinematic film still", "color_palette": ["#FF9B54", "#7A3B69", "#D35B40", "#2C3E50", "#F4D03F"]}, "compositional_deconstruction": {"background": "A vast, sweeping desert landscape with historic Arabian architecture, sand dunes, and a vibrant sunset sky.", "elements": [{"type": "obj", "bbox": [200, 300, 700, 700], "desc": "A richly detailed, ornate flying carpet suspended in mid-air."}, {"type": "obj", "bbox": [100, 350, 600, 650], "desc": "A romantic couple sitting on the flying carpet, holding hands and looking out over the city."}, {"type": "obj", "bbox": [600, 0, 1000, 1000], "desc": "An ancient Arabian desert town with sandstone buildings, domes, and bustling streets far below."}]}}
negative_prompt: ""
height: 1024
width: 1024
num_inference_steps: 50
guidance_scale: 7.0
seed: 42

global_batch_size_to_train_on: 1
per_device_batch_size: 1

enable_profiler: False
enable_ml_diagnostics: False
profiler_steps: 5
skip_jax_distributed_system: False
skip_jax_compilation: False
hardware: "tpu"
jax_cache_dir: ""
weights_dtype: "bfloat16"
activations_dtype: "bfloat16"
save_config_to_gcs: False
# "flash" routes self-attention through the splash kernel; "dot_product" keeps
# the dense (B, H, L, L) einsum. They are numerically equivalent (see
# generate_ideogram_smoke_test.py::test_attention_backends_agree_end_to_end),
# so this is purely a performance choice -- and which one wins depends on the
# sequence length. Measured on 8x TPU7x, 34 layers, bf16, tp8, 50 steps,
# 1024x1024 (seq 4608), against the real fp8 checkpoint:
#
#     kernel                       ms/step
#     dot_product                    179.4   <- dense wins by 40%
#     flash  bq=2304 bkv=512         251.7
#     flash  bq=1024 bkv=1024        264.2
#     flash  bq=768  bkv=4608        268.5
#
# See results/ideogram/attention.md. Attention is only ~14% of this model's
# FLOPs at 1024x1024, so a faster attention core cannot pay for the sequence
# padding it costs. Flash should win once attention's O(L^2) share grows --
# 1536x1536 (seq 9728) is the expected crossover, NOT YET RE-MEASURED against a
# real checkpoint. Dense is also O(L^2) in memory and will hit a VMEM wall well
# before flash does.
attention: "dot_product"
# head_dim is 256 here, which is large enough that the splash library defaults
# pick a tile that spills VMEM and runs ~16x slower than the dense einsum.
# Re-benchmark after changing these.
flash_block_sizes: {
  "block_q" : 1024,
  "block_kv" : 1024,
}
# Tile-size auto-tuning. When enable_tile_search: True, generate_ideogram runs a
# fast one-block grid search before loading weights and overwrites
# flash_block_sizes with the winner. Only meaningful for attention: "flash".
enable_tile_search: False
tile_search_mode: "smart"   # "smart" (candidate ladders) | "full" (exhaustive O(N^2))
tile_search_iters: 10
tile_search_out: ""
tile_search_text_tokens: 512
attention_sharding_uniform: True
mesh_axes: ['data', 'fsdp', 'context', 'tensor']
logical_axis_rules: [
                      ['batch', 'data'],
                      ['activation_heads', 'fsdp'],
                      ['activation_batch', 'data'],
                      ['activation_kv', 'tensor'],
                      ['mlp','tensor'],
                      ['embed','fsdp'],
                      ['heads', 'tensor'],
                      ['norm', 'fsdp'],
                      ['conv_batch', ['data','fsdp']],
                      ['out_channels', 'tensor'],
                      ['conv_out', 'fsdp'],
                      ['conv_in', 'fsdp']
                    ]
data_sharding: [['data', 'fsdp', 'context', 'tensor']]
dcn_data_parallelism: 1
dcn_fsdp_parallelism: -1
dcn_context_parallelism: 1
dcn_tensor_parallelism: 1
# Tensor parallelism, not FSDP. Measured on 8x TPU7x at 1024x1024, 50 steps
# (results/ideogram/sharding.md): tp8 179.4 ms/step vs fsdp8 315.4, a 1.76x win.
# FSDP shards the CONTRACTING dim of qkv/w1/w3, so every layer needs a collective
# to reconstitute activations; there is no backward pass at inference to amortize
# that against. Mixed meshes are worse than either pure axis (fsdp4_tp2 258.7,
# fsdp2_tp4 332.3).
# For throughput rather than latency, per_device_batch_size: 2 gives 136.2
# ms/step/image (saturates there; bs=4 is identical per image).
ici_data_parallelism: 1
ici_fsdp_parallelism: 1
ici_context_parallelism: 1
ici_tensor_parallelism: -1
allow_split_physical_axes: False
learning_rate_schedule_steps: -1
max_train_steps: 500
unet_checkpoint: ''
dataset_name: ''
dataset_save_location: ''
compile_topology_num_slices: -1
quantization_local_shard_count: -1
use_qwix_quantization: False
