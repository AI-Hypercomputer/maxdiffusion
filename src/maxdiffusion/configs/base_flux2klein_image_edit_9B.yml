# This sentinel is a reminder to choose a real run name.
run_name: 'flux2klein_image_edit_9b'

metrics_file: "" # for testing, local file that stores scalar metrics. If empty, no metrics are written.
write_metrics: True

timing_metrics_file: "" # for testing, local file that stores function timing metrics such as state creation, compilation. If empty, no metrics are written.
write_timing_metrics: True 

gcs_metrics: False
save_config_to_gcs: False
log_period: 100

pretrained_model_name_or_path: 'black-forest-labs/FLUX.2-klein-9B'
clip_model_name_or_path: 'ariG23498/clip-vit-large-patch14-text-flax'
t5xxl_model_name_or_path: 'ariG23498/t5-v1-1-xxl-flax'

# Flux params
flux_name: "flux2klein"
scale_shift_order: "scale_shift"
use_latents: False
latents_path: ""
max_sequence_length: 512
time_shift: True
base_shift: 0.5
max_shift: 1.15

unet_checkpoint: ''
revision: 'refs/pr/95'
weights_dtype: 'bfloat16'
activations_dtype: 'bfloat16'
precision: "DEFAULT"

jit_initializers: True
from_pt: True
split_head_dim: True
attention: 'flash'
mask_padding_tokens: True 
attention_sharding_uniform: True 

flash_block_sizes: {
  "block_q": 4608,
  "block_kv": 1024,
  "block_kv_compute": 1024,
}
ulysses_shards: 2
ulysses_attention_chunks: 1
text_encoder_attention: 'flash'
text_encoder_flash_block_sizes: {
  "block_q": 512,
  "block_kv": 512,
  "block_kv_compute": 512,
}
text_encoder_max_layer: 27
norm_num_groups: 32

train_new_flux: False
train_text_encoder: False
text_encoder_learning_rate: 4.25e-6
snr_gamma: -1.0

timestep_bias: {
  strategy: "none",
  multiplier: 1.0,
  begin: 0,
  end: 1000,
  portion: 0.25
}

diffusion_scheduler_config: {
  _class_name: 'FlaxEulerDiscreteScheduler',
  prediction_type: 'epsilon',
  rescale_zero_terminal_snr: False,
  timestep_spacing: 'trailing'
}

base_output_directory: ""
hardware: 'tpu'
skip_jax_distributed_system: False

mesh_axes: ['data', 'fsdp', 'context', 'tensor']
logical_axis_rules: [
  ['batch', 'data'],
  ['activation_batch', ['data','fsdp']],
  ['activation_heads', 'tensor'],
  ['activation_kv', 'tensor'],
  ['mlp','tensor'],
  ['embed','fsdp'],
  ['heads', 'tensor'],
  ['conv_batch', ['data','fsdp']],
  ['out_channels', 'tensor'],
  ['conv_out', 'fsdp'],
]
data_sharding: [['data', 'fsdp', 'context', 'tensor']]

dcn_data_parallelism: 1
dcn_fsdp_parallelism: 1
dcn_context_parallelism: 1
dcn_tensor_parallelism: 1
ici_data_parallelism: -1
ici_fsdp_parallelism: 1
ici_context_parallelism: 1
ici_tensor_parallelism: 1

allow_split_physical_axes: False

dataset_name: 'diffusers/pokemon-gpt4-captions'
train_split: 'train'
dataset_type: 'tfrecord'
cache_latents_text_encoder_outputs: True
dataset_save_location: '/tmp/pokemon-gpt4-captions_xl'
train_data_dir: ''
dataset_config_name: ''
jax_cache_dir: ''
hf_data_dir: ''
hf_train_files: ''
hf_access_token: ''
image_column: 'image'
caption_column: 'text'
resolution: 512
center_crop: False
random_flip: False
tokenize_captions_num_proc: 4
transform_images_num_proc: 4
reuse_example_batch: False
enable_data_shuffling: True

checkpoint_every: -1
enable_single_replica_ckpt_restoring: False

learning_rate: 1.e-5
scale_lr: False
max_train_samples: -1
max_train_steps: 1500
num_train_epochs: 1
seed: 0
output_dir: 'output/'
output_name: "flux2klein_image_edit_9b_output.png"
per_device_batch_size: 1.0

warmup_steps_fraction: 0.1
learning_rate_schedule_steps: -1

adam_b1: 0.9
adam_b2: 0.999
adam_eps: 1.e-8
adam_weight_decay: 0
opt_enable_grad_clipping: False
max_grad_value: 1.0
opt_enable_grad_global_norm_clipping: False
max_grad_norm: 1.0

enable_profiler: False
skip_first_n_steps_for_profiler: 5
profiler_steps: 10
profiler: ""

prompt: "a vibrant artistic painting combining the dog, car, mountain, and fruit bowl in surreal neon lighting"
negative_prompt: ""
do_classifier_free_guidance: True
guidance_scale: 4.0
guidance_rescale: 0.0
num_inference_steps: 4
num_reps: 1
save_final_checkpoint: False

lightning_from_pt: True
lightning_repo: ""
lightning_ckpt: ""

lora_config: {
  lora_model_name_or_path: [],
  weight_name: [],
  adapter_name: [],
  scale: [],
  from_pt: []
}

enable_mllog: False

controlnet_model_name_or_path: 'diffusers/controlnet-canny-sdxl-1.0'
controlnet_from_pt: True
controlnet_conditioning_scale: 0.5
controlnet_image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/1024px-Google_%22G%22_logo.svg.png'
quantization: ''
quantization_local_shard_count: -1
use_qwix_quantization: False 
compile_topology_num_slices: -1

enable_ml_diagnostics: False
profiler_gcs_path: ""
enable_ondemand_xprof: False

height: 512
width: 512
batch_size: 1
interactive: False

# Reference image conditioning paths for image editing
image_paths: [
  "/mnt/data/golden_image_edit_data/ref_images/ref_image_0.png",
  "/mnt/data/golden_image_edit_data/ref_images/ref_image_1.png",
  "/mnt/data/golden_image_edit_data/ref_images/ref_image_2.png",
  "/mnt/data/golden_image_edit_data/ref_images/ref_image_3.png",
]
